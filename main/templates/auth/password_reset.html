{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 450px; border-radius: 12px; border: 1px solid #e0e0e0;">
        <h2 class="mb-4 text-center fw-bold" style="color: #FFC107;">Réinitialiser le mot de passe</h2>
        
        <p class="text-center mb-4" style="font-size: 0.9rem; color: #555;">
            Entrez votre adresse e-mail et nous vous enverrons un lien pour réinitialiser votre mot de passe.
        </p>
        
        <form method="POST" novalidate>
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="{{ form.email.id_for_label }}" class="form-label fw-semibold">Adresse e-mail</label>
                {{ form.email }}
            </div>
            
            <button type="submit" 
                    class="btn w-100 fw-bold py-2 rounded-3 shadow-sm" 
                    style="font-size: 1rem; letter-spacing: 0.5px; background-color: #D9B300; color: #212529; border: none;">
                Envoyer le lien de réinitialisation
            </button>
        </form>
    </div>
</div>

<!-- Optionnel : CSS pour styliser le champ email -->
<style>
input[name="email"] {
    background-color: #FFF9E6;
    border: 1px solid #e0e0e0;
    border-radius: 0.5rem;
    padding: 0.65rem 0.75rem;
    font-size: 1rem;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
}
</style>
{% endblock %}
