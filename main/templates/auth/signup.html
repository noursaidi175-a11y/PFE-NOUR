{% extends "base.html" %}

{% block title %}Inscription{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 500px; border-radius: 12px; border: 1px solid #e0e0e0;">
        <h2 class="mb-4 text-center fw-bold" style="color: #FFC107;">Créer un compte</h2>
        
        <form method="POST" novalidate>
            {% csrf_token %}
            
            {% for field in form %}
            <div class="mb-3">
                <label class="form-label fw-semibold">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                <div class="text-danger" style="font-size: 0.85rem;">
                    {{ field.errors }}
                </div>
                {% endif %}
            </div>
            {% endfor %}
            
            <button type="submit" 
                    class="btn w-100 fw-bold py-2 rounded-3 shadow-sm" 
                    style="font-size: 1rem; letter-spacing: 0.5px; background-color: #D9B300; color: #212529; border: none;">
                S'inscrire
            </button>
        </form>

        <p class="text-center mt-3" style="font-size: 0.9rem;">
            Tu as déjà un compte ? <a href="{% url 'login' %}">Connecte-toi ici</a>.
        </p>
    </div>
</div>

<!-- CSS pour styliser les champs -->
<style>
input, select {
    background-color: #FFF9E6;
    border: 1px solid #e0e0e0;
    border-radius: 0.5rem;
    padding: 0.65rem 0.75rem;
    font-size: 1rem;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    width: 100%;
}
</style>
{% endblock %}
