{% extends "base.html" %}
{% block title %}Upload Fichier à Clusteriser{% endblock %}
{% block content %}
<h2>Upload d’un fichier à clusteriser</h2>

{% if error %}
  <div class="alert alert-danger">{{ error }}</div>
{% endif %}

<form method="post" enctype="multipart/form-data" class="mt-3">
  {% csrf_token %}
  <input type="file" name="file" accept=".csv" class="form-control" required />
  <button type="submit" class="btn btn-sn mt-3">Envoyer</button>
</form>
{% endblock %}
